name: Deploy BisaBikinWeb Media V2
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '31 * * * *'
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MEDIA_CONTENT_SOURCE: bbweb
      MEDIA_MAIN_CONFIG_PATH: source-main/static-source/lib/supabase.ts
      # Do not index mirrored articles until editorial URL migration is agreed.
      MEDIA_INDEXABLE: 'false'
    steps:
      - name: Checkout Media V2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout existing editorial configuration (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mejaviskinc/bisabikinweb
          ref: main
          path: source-main
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test V2 functionality without production data
        run: npm test
        env:
          MEDIA_CONTENT_SOURCE: demo
      - name: Build with existing published editorial content
        run: npm run build
      - name: Validate real publication and avoid accidental SEO duplication
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/admin/index.html
          test ! -f dist/sitemap.xml
          grep -q 'noindex,nofollow' dist/index.html
          ! grep -q 'Konten demonstrasi' dist/index.html
          test "$(find dist/artikel -mindepth 1 -maxdepth 1 -type d | wc -l)" -gt 0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-media
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-media
